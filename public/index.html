<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132333">
  <meta name="description" content="A silent party game of clues, bluffing, and very suspicious friends.">
  <title>Perfectly Suspicious</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./gamefeel.css">
  <link rel="stylesheet" href="./room3d.css">
  <link rel="stylesheet" href="./interface.css">
  <link rel="stylesheet" href="./hud.css">
  <link rel="stylesheet" href="./play-clarity.css">
  <link rel="stylesheet" href="./results.css">
</head>
<body>
  <div id="room-stage" aria-hidden="true"></div>
  <div class="room-atmosphere" aria-hidden="true"><span class="searchlight"></span><span class="dust dust-one"></span><span class="dust dust-two"></span></div>
  <button class="skip" id="skip-game">Skip to game</button>
  <main id="main" tabindex="-1"></main>
  <button id="settings-open" class="settings-toggle" aria-label="Game settings" aria-haspopup="dialog"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 3H20L21 8L25 10L29 12V20L24 22L21 25L20 29H12L10 24L7 22L3 20V12L8 10L10 7Z" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></button>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <button class="dialog-close outline" id="settings-close" aria-label="Close settings">Close</button>
    <p class="eyebrow">Make yourself comfortable</p><h2 id="settings-title">Game settings</h2>
    <div class="sound-setting"><div><h3>Music and effects</h3><p class="small-note">A little intrigue for your investigation.</p></div><button id="sound" class="secondary" aria-label="Sound" aria-pressed="true">Sound on</button></div>
    <label class="motion-label" for="motion">Motion<select id="motion" aria-label="Motion"><option value="system">Device setting</option><option value="reduce">Reduced</option></select></label>
  </dialog>
  <dialog id="invite-dialog" aria-labelledby="invite-title" aria-describedby="invite-help">
    <button class="dialog-close outline" id="invite-close" aria-label="Close invitation">Close</button>
    <p class="eyebrow">Bring your suspects</p><h2 id="invite-title">Your invitation</h2>
    <p id="invite-help" class="small-note"></p>
    <label id="invite-label" for="invite-value">Invite link</label>
    <input id="invite-value" readonly autocomplete="off" spellcheck="false">
    <button id="invite-copy" class="primary wide">Copy again</button>
    <p id="invite-feedback" class="small-note" role="status" aria-live="polite"></p>
  </dialog>
  <p id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></p>
  <p id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
